services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - nlogistic-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - nlogistic-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.5.0
    container_name: filebeat
    user: root
    volumes:
      - ./Logging/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    command: >
      bash -c "
        chmod go-w /usr/share/filebeat/filebeat.yml;
        /usr/local/bin/docker-entrypoint -e
      "
    networks:
      - nlogistic-network
    depends_on:
      - elasticsearch

  redis:
    image: redis:latest
    container_name: nlogistic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nlogistic-network

  redisinsight: # This service now uses the official image directly
    container_name: redisinsight
    ports:
        - 5540:5540
    image: redis/redisinsight:latest
    command: -v redisinsight:/data
    networks:
      - nlogistic-network
    depends_on:
      - redis

  gateway:
    image: nlogistic-gateway # Assuming this is the name of your gateway image
    container_name: nlogistic-gateway
    ports:
      - "8180:80"
      - "8443:443"
    volumes:
      - ./Gateway/nlogistic.conf:/etc/nginx/conf.d/default.conf
      - ./Gateway/nginx-selfsigned.crt:/etc/nginx/nginx-selfsigned.crt
      - ./Gateway/nginx-selfsigned.key:/etc/nginx/nginx-selfsigned.key
      - ./Gateway/jwt_public.jwks.json:/etc/nginx/jwt_public.jwks.json
    networks:
      - nlogistic-network

volumes:
  elasticsearch-data:
    driver: local
  filebeat-data:
    driver: local
  redis-data:
    driver: local

networks:
  nlogistic-network:
    driver: bridge
